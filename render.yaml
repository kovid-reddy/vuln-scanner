# render.yaml — Render deployment blueprint for WebScore
#
# Architecture:
#   - ONE web service (API + BullMQ worker in the same process)
#   - ONE Redis service (internal, used by BullMQ)
#   - Database: Supabase PostgreSQL (external — set DATABASE_URL manually in the Render dashboard)
#
# Environment variables marked sync: false MUST be set manually in the Render dashboard.

services:
  - type: redis
    name: vuln-scanner-redis
    plan: free
    ipAllowList: [] # Restricted to internal services only

  - type: web
    name: vuln-scanner-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pnpm install && cd apps/api && npx prisma generate
    startCommand: cd apps/api && npx prisma migrate deploy && npx tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 4000

      # Supabase PostgreSQL — enter your connection string in the Render dashboard.
      # Format: postgresql://postgres:[PASSWORD]@db.[PROJECT-REF].supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false

      # Auto-injected from the Redis service above
      - key: REDIS_URL
        fromService:
          type: redis
          name: vuln-scanner-redis
          property: connectionString

      # Your Vercel frontend URL — enter in the Render dashboard after deploying the frontend.
      # Example: https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
